name: CI

on:
  push:
    branches: [ main, deploy ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: 3001
      # secrets to be configured in GitHub repository settings
      MORRISONS_API_KEY: ${{ secrets.MORRISONS_API_KEY }}
      REACT_APP_GOOGLE_MAPS_API_KEY: ${{ secrets.REACT_APP_GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: morrisons_store_finder

      - name: Build frontend
        run: npm run build
        working-directory: morrisons_store_finder

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: morrisons_store_finder

      - name: Start backend (server.js)
        run: |
          nohup node server.js > server.log 2>&1 &
          echo "Backend started on port ${PORT}"
        working-directory: morrisons_store_finder

      - name: Serve frontend build
        run: |
          npx http-server build -p 3000 -a 0.0.0.0 -c-1 > http-server.log 2>&1 &
          echo "Frontend build served on port 3000"
        working-directory: morrisons_store_finder

      - name: Wait for services (frontend + backend)
        run: |
          sleep 2
          npx wait-on http://127.0.0.1:3000 http://127.0.0.1:3001 --timeout 60000
        working-directory: morrisons_store_finder

      - name: Run Playwright tests
        env:
          CI: true
        run: npx playwright test --config=playwright.config.ts --reporter=list
        working-directory: morrisons_store_finder

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: morrisons_store_finder/playwright-report

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            morrisons_store_finder/server.log
            morrisons_store_finder/http-server.log

  deploy-vercel:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/deploy' && secrets.VERCEL_TOKEN != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel (production)
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel --prod --confirm --token $VERCEL_TOKEN